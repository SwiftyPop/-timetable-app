[package]
name = "timetable-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust core logic for university schedule calculations, ICS export, and reminders"
authors = ["swifty"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"

[dev-dependencies]
