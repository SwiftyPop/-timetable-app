[package]
name = "timetable-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly bindings for university timetable schedule engine"
authors = ["swifty"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
timetable-core = { path = "../timetable-core" }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false }


